id = "nonexistent_repo"
category = "error_recovery"
prompt = '''List issues in openclaw/this-does-not-exist and tell me what happened.'''
max_llm_calls = 12
timeout_secs = 300
leaves = ["gh_api", "gh_graphql", "jq"]
tree_file = "../general-tree.json"
reference_route = [6]
expected_capability = 6
grading_hint = '''The repository does not exist; the correct answer is a 404 / 'Not Found' error. Correctly identifying and reporting the not-found error is a PASS (this is an error-recovery task).'''

[input]
owner = "openclaw"
name = "this-does-not-exist"

# Semantic check, not the tree's literal stderr surface: any honest
# not-found/404 report passes, whichever arm produced it.
[checker]
type = "regex"
must = ['(?i)not found|404|does not exist|could not resolve']
forbid = []
