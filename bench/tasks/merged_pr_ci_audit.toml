id = "merged_pr_ci_audit"
category = "investigation"
prompt = '''Look at the 10 most recently merged PRs in openclaw/openclaw — ordered by merge time (mergedAt), newest first; note the API's default PR ordering is NOT merge time, so sort before taking 10. For each one, report the title, author, and whether all CI checks passed. Then tell me how many of the 10 had fully green CI.'''
max_llm_calls = 12
timeout_secs = 300
leaves = ["gh_api", "gh_graphql", "jq"]
tree_file = "../general-tree.json"
reference_route = [5]
expected_capability = 5
grading_hint = '''Report about 10 recently-merged PRs, each with its author and CI status (green/red), plus a green_count. The count of fully-green PRs must be based on ACTUAL check-rollup data (not assumed all-green). Exact ordering is not graded, but the reported CI status must reflect real check results, so a green_count of 9 or 10 based on real data is acceptable while a made-up or missing CI status is not.'''

[input]
owner = "openclaw"
name = "openclaw"

[checker]
type = "contains_values"
