[workspace]
resolver = "3"
members = [
    "crates/leaf-traits",
    "crates/leaf-core",
    "crates/leaf-mcp",
    "crates/leaf-llm",
    "crates/leaf-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Adrian Jastrzębski <admin@example.com>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "1", features = ["client", "transport-io", "transport-child-process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand_core = "0.9"
rand_chacha = { version = "0.9", default-features = false }
sha2 = "0.10"
tiktoken-rs = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
regex = "1"
libc = "0.2"

leaf-traits = { path = "crates/leaf-traits" }
leaf-core = { path = "crates/leaf-core" }
leaf-mcp = { path = "crates/leaf-mcp" }
leaf-llm = { path = "crates/leaf-llm" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
